[project]
name = "aetherswap"
version = "0.1.0"
description = "Steam 低价余额助手"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "fastapi>=0.100.0",
    "numpy>=1.20.0",
    "playwright>=1.40.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "qrcode[pil]>=7.0.0",
    "requests>=2.28.0",
    "sqlmodel>=0.0.14",
    "steampy>=0.8.0",
    "typing-extensions>=4.15.0",
    "urllib3>=2.0.0",
    "uvicorn>=0.22.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff>=0.16.7"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["F401", "F811", "F821", "F822", "F841"]
